[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-chat-manager"
version = "0.1.0"
description = "Browse, summarize and delete local Claude Code conversations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BeatLink" }]

[project.optional-dependencies]
tui = ["textual>=0.80"]
gtk = ["pygobject>=3.46"]

[project.scripts]
claude-chat-manager = "claude_chat_manager.cli:main"
ccm = "claude_chat_manager.cli:main"

[project.gui-scripts]
claude-chat-manager-gtk = "claude_chat_manager.gtkapp:run"

[tool.setuptools.packages.find]
include = ["claude_chat_manager*"]

[tool.setuptools.package-data]
claude_chat_manager = ["static/*"]
